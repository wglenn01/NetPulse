server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip for the SPA assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> backend service (same origin as the UI)
    location /api/ {
        # Re-resolve the backend hostname via Docker's embedded DNS at request
        # time. Without this, nginx caches the backend IP at startup, so if the
        # backend container restarts (new IP) every /api call returns 502 until
        # nginx is restarted. Using a variable forces per-request resolution.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $netpulse_backend backend;
        proxy_pass http://$netpulse_backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Long-cache hashed static assets
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
