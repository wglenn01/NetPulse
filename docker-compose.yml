# NetPulse - self-hosted network visibility (SNMP v2c + ICMP)
# Usage:
#   cp .env.docker.example .env   &&   edit .env
#   docker compose up -d --build
#   open http://<server-ip>
name: netpulse

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-netpulse}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db
    # Not exposed to the host by default (backend reaches it over the internal
    # network). Uncomment to inspect locally:
    # ports: ["127.0.0.1:27017:27017"]

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-netpulse}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/${DB_NAME:-netpulse}?authSource=admin
      DB_NAME: ${DB_NAME:-netpulse}
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TZ: ${TZ:-UTC}
    # ICMP: allow unprivileged ping (icmplib) from inside the container.
    cap_add:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mongo_data:
